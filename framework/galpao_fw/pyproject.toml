# Empacotamento do motor (plano de 2026-10-08, Fase 1; D216).
#
# Pacote PLANO: cada modulo de framework/galpao_fw e' instalado com o nome que
# ja tem (`import condutores_nbr5410`), sem renomear import nenhum. Serve para
# outro projeto INSTALAR o motor em vez de por esta pasta no sys.path.
#
# Limite conhecido: a instalacao comum (copia para o site-packages) so serve aos
# modulos de calculo. O que le a arvore do repositorio pelo proprio caminho
# (framework.raiz_repo, as varreduras, os scripts enviados ao FreeCAD) so
# funciona na instalacao editavel (`pip install -e` / `uv pip install -e`).
#
# A lista de modulos e' conferida contra a pasta por
# tests/test_empacotamento_d216.py: modulo novo fora da lista reprova.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galpao-fw"
version = "0.1.0"
description = "Motor de calculo e de desenho do FreeCad_Automatic (galpao, eletrico, IFC, DXF), sem FreeCAD no caminho de importacao"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = [
    "acos",
